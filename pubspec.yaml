name: apna_saving
description: Apna Saving - Digital Chit Fund Management App
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Existing (kept)
  provider: ^6.0.5
  google_fonts: ^6.1.0
  intl: ^0.18.1
  fl_chart: ^0.63.0
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^16.3.0

  # HTTP client for Laravel API
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^14.0.0

  # Payment
  razorpay_flutter: ^1.3.6

  # Firebase Push
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # Real-time auction (Pusher)
  pusher_channels_flutter: ^2.0.2

  # KYC WebView + Razorpay mandate
  webview_flutter: ^4.8.0

  # PDF + JPG (Passbook, Chit Builder)
  pdf: ^3.10.8
  printing: ^5.12.0
  screenshot: ^2.1.0

  # Sharing
  share_plus: ^9.0.0

  # Offline cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # KYC document upload
  image_picker: ^1.1.2
  file_picker: ^8.0.0

  # URL launching (Digio redirect)
  url_launcher: ^6.3.0

  # Connectivity
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Bold.ttf
          weight: 700
